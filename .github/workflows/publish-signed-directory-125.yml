name: Publish verified EEPROM Studio 1.0.25 update-check fix from signed artifact
on:
  push:
    branches: [main]
    paths:
      - 'apk/publish-request-v1.0.25.json'
permissions:
  contents: write
concurrency:
  group: xp400-verified-manifest
  cancel-in-progress: false
jobs:
  signed-import:
    if: github.repository == 'kaissymarji/star-mobile-downloads.'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0' 'platform-tools'
      - name: Obtain exact signed private build artifact and reject any unexpected bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release123"
          python3 - <<'PY'
          import json,urllib.parse,os
          j=json.load(open('apk/publish-request-v1.0.25.json'))
          u=urllib.parse.urlsplit(j['artifactZipUrl'])
          assert u.scheme=='https' and u.hostname=='sdmntprwestus.oaiusercontent.com'
          assert u.path.endswith('/raw')
          assert j['tag']=='v1.0.25'
          assert j['apkSha256']=='55c3b3c8ec8002488e416e84e1a058974fd8ca941c00f0c91207e9a330a8552c'
          with open(os.environ['RUNNER_TEMP']+'/release123/source-url','w') as f:f.write(j['artifactZipUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 80 -o "$RUNNER_TEMP/release123/asset.zip" "$(cat "$RUNNER_TEMP/release123/source-url")"
          test $(stat -c %s "$RUNNER_TEMP/release123/asset.zip") -le 6000000
          unzip -p "$RUNNER_TEMP/release123/asset.zip" EEPROM-Studio.apk > "$RUNNER_TEMP/release123/EEPROM-Studio.apk"
          echo '55c3b3c8ec8002488e416e84e1a058974fd8ca941c00f0c91207e9a330a8552c  '"$RUNNER_TEMP/release123/EEPROM-Studio.apk" | sha256sum -c -
      - name: Verify package, permanent signing certificate, version and update channel
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-uploaded-apk.py --apk "$RUNNER_TEMP/release123/EEPROM-Studio.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous update.json --output "$RUNNER_TEMP/release123/verified.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/release123/verified.json'))
          assert x['versionCode']==125 and x['tag']=='v1.0.25'
          assert x['sha256']=='55c3b3c8ec8002488e416e84e1a058974fd8ca941c00f0c91207e9a330a8552c'
          PY
      - name: Publish user-requested signed prerelease and explicit hardware warning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release123/notes.md" <<'EOF'
          EEPROM Studio 1.0.25 adds a **Download APKs · All versions** button.
          Tap it to open the official GitHub Releases directory for current and previous EEPROM Studio versions. Existing automatic update detection remains enabled.
          
          XP400, CAS3, CH341A and Stripe Save behavior are unchanged.
          **CH341A EEPROM writing remains an experimental, physically unverified feature.** Do not write important chips until validated on expendable hardware with correct voltage.
          EOF
          if gh release view v1.0.25 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download v1.0.25 -R "$GITHUB_REPOSITORY" --pattern EEPROM-Studio.apk --dir "$RUNNER_TEMP/release123/existing"
            cmp "$RUNNER_TEMP/release123/existing/EEPROM-Studio.apk" "$RUNNER_TEMP/release123/EEPROM-Studio.apk"
          else
            gh release create v1.0.25 "$RUNNER_TEMP/release123/EEPROM-Studio.apk#EEPROM-Studio.apk" -R "$GITHUB_REPOSITORY" --target main --title 'EEPROM Studio 1.0.25 — Updater Cache Fix' --notes-file "$RUNNER_TEMP/release123/notes.md" --prerelease
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.25" > "$RUNNER_TEMP/release123/release.json"
      - name: Verify exact published asset digest and update older app feed
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-apk-release.py --release "$RUNNER_TEMP/release123/release.json" --apk "$RUNNER_TEMP/release123/EEPROM-Studio.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous update.json --output update.json
          python3 - <<'PY'
          import json
          d=json.load(open('update.json'))
          assert d['versionCode']==125 and d['versionName']=='1.0.25'
          assert d['apkSha256']=='55c3b3c8ec8002488e416e84e1a058974fd8ca941c00f0c91207e9a330a8552c'
          PY
      - name: Commit verified update.json so EEPROM Studio 1.0.22 detects new version
        run: |
          set -euo pipefail
          git add update.json
          if git diff --cached --quiet; then
            echo 'Manifest already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified EEPROM Studio 1.0.25 experimental update [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
