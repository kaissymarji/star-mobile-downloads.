name: Publish V200 Diagnostic APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/v200_diag_1.1.11_debug.apk'
      - '.github/workflows/publish-v200-diagnostic.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check APK and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="apk/v200_diag_1.1.11_debug.apk"
          tag="v200-diag-1.1.11"
          test -s "$apk"
          test "$(wc -c < "$apk" | tr -d ' ')" = "304519"
          echo "cf79f02fbc2505abd3615a72c2eaf0efe51f80347f3521e01d7fd16811f7fda5  $apk" | sha256sum -c -
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'v200_diag_1.1.11_debug.apk'; then
              echo "Already published; preserving existing download count"
              exit 0
            fi
            gh release upload "$tag" "$apk" --clobber=false
          else
            gh release create "$tag" "$apk" --title "V200 Diagnostic v1.1.11 — Android Test Build" --notes "Experimental Android debug APK for Autel MaxiVCI V200. Not all vehicle and ECU features have been physically verified." --prerelease
          fi
