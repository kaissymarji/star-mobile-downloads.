name: Publish verified EEPROM Studio 1.0.23 CH341A beta from signed artifact
on:
  push:
    branches: [main]
    paths:
      - 'apk/publish-request-v1.0.23.json'
permissions:
  contents: write
concurrency:
  group: xp400-verified-manifest
  cancel-in-progress: false
jobs:
  signed-import:
    if: github.repository == 'kaissymarji/star-mobile-downloads.'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;36.0.0' 'platform-tools'
      - name: Obtain exact signed private build artifact and reject any unexpected bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release123"
          python3 - <<'PY'
          import json,urllib.parse,os
          j=json.load(open('apk/publish-request-v1.0.23.json'))
          u=urllib.parse.urlsplit(j['artifactZipUrl'])
          assert u.scheme=='https' and u.hostname=='sdmntprwestus2.oaiusercontent.com'
          assert u.path.endswith('/raw')
          assert j['tag']=='v1.0.23'
          assert j['apkSha256']=='e5d3b4353d6042ffb5ca776355cc3a397a4d0b590dc90f97ab039d4280c67ed4'
          with open(os.environ['RUNNER_TEMP']+'/release123/source-url','w') as f:f.write(j['artifactZipUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 80 -o "$RUNNER_TEMP/release123/asset.zip" "$(cat "$RUNNER_TEMP/release123/source-url")"
          test $(stat -c %s "$RUNNER_TEMP/release123/asset.zip") -le 6000000
          unzip -p "$RUNNER_TEMP/release123/asset.zip" EEPROM-Studio.apk > "$RUNNER_TEMP/release123/EEPROM-Studio.apk"
          echo 'e5d3b4353d6042ffb5ca776355cc3a397a4d0b590dc90f97ab039d4280c67ed4  '"$RUNNER_TEMP/release123/EEPROM-Studio.apk" | sha256sum -c -
      - name: Verify package, permanent signing certificate, version and update channel
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-uploaded-apk.py --apk "$RUNNER_TEMP/release123/EEPROM-Studio.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous update.json --output "$RUNNER_TEMP/release123/verified.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/release123/verified.json'))
          assert x['versionCode']==123 and x['tag']=='v1.0.23'
          assert x['sha256']=='e5d3b4353d6042ffb5ca776355cc3a397a4d0b590dc90f97ab039d4280c67ed4'
          PY
      - name: Publish user-requested signed prerelease and explicit hardware warning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release123/notes.md" <<'EOF'
          EEPROM Studio 1.0.23 adds **experimental CH341A EEPROM write support** for selected M95xx SPI and standard 24Cxx I2C chips.
          
          **IMPORTANT: CH341A physical writing has NOT been verified on real hardware.** Use expendable chips only. Some CH341A boards can output unsafe voltages; verify actual adapter voltage, WP/HOLD wiring and chip datasheet before writing. Read and back up your chip first; programming can permanently corrupt data. No CH341A erase, MCU, or transponder writing.
          
          Preserves QA115 CAS3 reader, Stripe membership checks for saving files, and verified app update notifications.
          This is a signed **experimental prerelease**, not a fully validated hardware release. Installing is optional.
          EOF
          if gh release view v1.0.23 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download v1.0.23 -R "$GITHUB_REPOSITORY" --pattern EEPROM-Studio.apk --dir "$RUNNER_TEMP/release123/existing"
            cmp "$RUNNER_TEMP/release123/existing/EEPROM-Studio.apk" "$RUNNER_TEMP/release123/EEPROM-Studio.apk"
          else
            gh release create v1.0.23 "$RUNNER_TEMP/release123/EEPROM-Studio.apk#EEPROM-Studio.apk" -R "$GITHUB_REPOSITORY" --target main --title 'EEPROM Studio 1.0.23 — Experimental CH341A Write Beta' --notes-file "$RUNNER_TEMP/release123/notes.md" --prerelease
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.23" > "$RUNNER_TEMP/release123/release.json"
      - name: Verify exact published asset digest and update older app feed
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-apk-release.py --release "$RUNNER_TEMP/release123/release.json" --apk "$RUNNER_TEMP/release123/EEPROM-Studio.apk" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --previous update.json --output update.json
          python3 - <<'PY'
          import json
          d=json.load(open('update.json'))
          assert d['versionCode']==123 and d['versionName']=='1.0.23'
          assert d['apkSha256']=='e5d3b4353d6042ffb5ca776355cc3a397a4d0b590dc90f97ab039d4280c67ed4'
          PY
      - name: Commit verified update.json so EEPROM Studio 1.0.22 detects new version
        run: |
          set -euo pipefail
          git add update.json
          if git diff --cached --quiet; then
            echo 'Manifest already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified EEPROM Studio 1.0.23 experimental update [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
